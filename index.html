          <div class="colXs6 passwordProtected">
            <div class="security">
              <input id='password' type='text' placeholder="Enter Password..." onkeypress="handleKeyPress(event)"/>
              <script>
                  function validatePass(){
                      if(document.getElementById('password').value == 'Validus'){
                          window.location.href = "Compliance.html"; // Redirect on correct password
                          return false; // Prevent default link behavior
                      }else{
                          alert('incorrect password, contact author');
                          return false; // Stay on the page for incorrect password
                      }
                  }

                  function handleKeyPress(event) {
                    if (event.key === 'Enter') {
                      validatePass(); // Call validatePass function when Enter is pressed
                    }
                  }
              </script>
            </div>
            <a id="compliance" class="gradient-overlay grid-item" href="Compliance.html" onclick="javascript:return validatePass()">
